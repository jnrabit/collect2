name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # volle History → regression_guard --range gegen Base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: doctor (fast gate)
        # Deterministischer Smoke-Check VOR dem Test-Lauf:
        # Syntax + auflösbare config-Importe (fängt Refactor-Breakage sofort).
        run: collect-doctor --fast

      - name: Tests
        run: pytest

      - name: Regression-Guard (report-only)
        # Meldet destruktiven Symbol-Verlust im PR-Diff. Nicht-blockierend —
        # der lokale Pre-Commit-Hook ist die erzwingende Schicht.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=0 || true
          collect-guard --range "origin/${{ github.base_ref }}..HEAD" || true
