<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- KaTeX für LaTeX-Mathe aus den ARXIV-Quellen ($…$ / $$…$$ / \(…\)).
     CDN: ohne Internet degradiert es sauber zu Rohtext. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- Markdown (marked) + Sanitizer (DOMPurify) — innerHTML nur nach Sanitize -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e27; --border: #2b2f3d;
    --text: #e4e6ee; --dim: #8b90a3; --accent: #6aa2ff; --user: #24304a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #conn { font-size: 12px; color: var(--dim); margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 18px; }
  .msg {
    max-width: 780px; margin: 0 auto 14px; padding: 10px 14px;
    border-radius: 10px; white-space: pre-wrap; word-wrap: break-word;
  }
  .user { background: var(--user); border: 1px solid #33415e; }
  .bot  { background: var(--panel); border: 1px solid var(--border); }
  .bot.rendered { white-space: normal; }  /* Markdown bringt eigene Absätze */
  .bot pre {
    background: #10131b; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-size: 13px;
  }
  .bot code { background: #10131b; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bot pre code { background: none; padding: 0; }
  .bot h1, .bot h2, .bot h3 { font-size: 1.05em; margin: 12px 0 4px; }
  .bot ul, .bot ol { margin: 6px 0; padding-left: 22px; }
  .bot p { margin: 6px 0; }
  .bot blockquote {
    margin: 6px 0; padding-left: 10px;
    border-left: 3px solid var(--border); color: var(--dim);
  }
  .bot table { border-collapse: collapse; margin: 8px 0; }
  .bot th, .bot td { border: 1px solid var(--border); padding: 4px 8px; }
  .bot .src-ref {
    color: var(--accent); cursor: pointer; text-decoration: underline dotted;
    font-weight: 600;
  }
  .bot .src-ref:hover { background: #1e2d4a; border-radius: 3px; }
  .bot .src-card {
    margin: 6px 0; padding: 10px 12px;
    border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    background: #151a26; font-size: 13px; max-height: 300px; overflow-y: auto;
    display: none;
  }
  .bot .src-card.open { display: block; }
  .src-list { font-size: 13px; color: var(--dim); margin-top: 8px; line-height: 1.8; }
  .bot .src-card em { color: var(--dim); font-style: normal; }
  .meta { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .progress {
    max-width: 780px; margin: 0 auto 14px; font-size: 13px;
    color: var(--dim); font-family: monospace;
  }
  form {
    display: flex; gap: 10px; padding: 14px 18px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  input {
    flex: 1; max-width: 720px; margin-left: auto; padding: 10px 14px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-right: auto; padding: 10px 20px; border: none; border-radius: 8px;
    background: var(--accent); color: #0c1322; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  select {
    padding: 10px 12px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
    cursor: pointer; min-width: 110px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  /* ── API-Settings-Panel ─────────────────────────────────────── */
  #settings-btn {
    background: none; border: 1px solid var(--border); color: var(--dim);
    font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    margin: 0; min-width: auto; line-height: 1;
  }
  #settings-btn:hover { color: var(--text); border-color: var(--accent); }
  #settings-btn.active { color: var(--accent); border-color: var(--accent); }
  #settings-panel {
    display: none; position: absolute; top: 44px; right: 18px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; z-index: 10; min-width: 280px;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  #settings-panel.open { display: block; }
  #settings-panel label { display: flex; align-items: center; gap: 10px;
    font-size: 14px; margin-bottom: 12px; cursor: pointer; }
  #settings-panel label.api-toggle { font-weight: 600; }
  #settings-panel input[type="checkbox"] {
    width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;
  }
  #settings-panel input[type="password"] {
    width: 100%; margin-top: 4px; padding: 8px 10px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: 13px monospace;
  }
  #settings-panel input[type="password"]:focus {
    outline: none; border-color: var(--accent);
  }
  #settings-panel .hint {
    font-size: 12px; color: var(--dim); margin-top: 6px;
  }
  #settings-panel .ds-status {
    font-size: 12px; margin-top: 8px; padding: 4px 8px;
    border-radius: 4px; background: #1a1e2a;
  }
  #settings-panel .ds-status.ok { color: #5fba7d; }
  #settings-panel .ds-status.off { color: var(--dim); }
  /* ── Modell-Antworten (Ensemble-Accordion) ──────────────────── */
  .ma-list { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; }
  .ma-entry { margin-bottom: 4px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .ma-header {
    padding: 6px 10px; background: var(--panel); cursor: pointer;
    font-size: 13px; display: flex; align-items: center; gap: 6px;
    user-select: none; transition: background .15s;
  }
  .ma-header:hover { background: #252844; }
  .ma-header .ma-name { font-weight: 600; color: var(--accent); }
  .ma-header .ma-score { color: var(--dim); font-size: 12px; }
  .ma-header .ma-badge {
    font-size: 11px; padding: 1px 6px; border-radius: 3px;
    background: #2a3a2a; color: #5fba7d; margin-left: auto;
  }
  .ma-header .ma-badge.winner { background: #2a3a2a; color: #5fba7d; }
  .ma-header .ma-badge.skipped { background: #2a2a2a; color: var(--dim); }
  .ma-header .ma-toggle { margin-left: auto; color: var(--dim); font-size: 11px; }
  .ma-body {
    padding: 8px 14px; background: var(--bg); border-top: 1px solid var(--border);
    font-size: 14px; line-height: 1.6; max-height: 400px; overflow-y: auto;
    display: none;
  }
  .ma-entry.open .ma-body { display: block; }
  .ma-entry.open .ma-toggle { display: none; }
  /* ── Engine-Banner ───────────────────────────────────────────── */
  #engine-banner {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 14px; background: #151a26;
    border-bottom: 1px solid var(--border);
    min-height: 100px; font-size: 12px;
  }
  #cluster-canvas-wrap {
    position: relative; flex-shrink: 0; width: 200px; height: 100px;
    background: #0c0f17; border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden; cursor: pointer;
  }
  #cluster-canvas-wrap:hover { border-color: var(--accent); }
  #cluster-canvas { width: 100%; height: 100%; }
  #cluster-overlay {
    position: absolute; top: 4px; left: 8px;
    font-family: monospace; font-size: 9px; color: #3a4058; line-height: 1.5;
    pointer-events: none;
  }
  /* ── Cluster-Map Popup ───────────────────────────────────────── */
  #cluster-popup {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.85); justify-content: center; align-items: center;
  }
  #cluster-popup.open { display: flex; }
  #cluster-popup-inner {
    position: relative; width: 90vw; height: 85vh;
    background: #0c0f17; border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  #cluster-popup-canvas { width: 100%; height: 100%; }
  #cluster-popup-close {
    position: absolute; top: 8px; right: 12px; z-index: 101;
    background: none; border: 1px solid var(--border); color: var(--dim);
    font-size: 20px; cursor: pointer; padding: 2px 8px; border-radius: 4px;
    min-width: auto;
  }
  #cluster-popup-close:hover { color: var(--text); border-color: var(--accent); }
  #cluster-popup-info {
    position: absolute; bottom: 10px; left: 14px; z-index: 101;
    font-family: monospace; font-size: 11px; color: #3a4058;
    pointer-events: none;
  }
  #engine-metrics {
    display: flex; flex-wrap: wrap; gap: 4px 16px;
    align-items: center; flex: 1;
  }
  .em-item { display: flex; flex-direction: column; min-width: 50px; }
  .em-label { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .em-value {
    font-size: 13px; font-weight: 600; font-family: monospace;
    white-space: nowrap;
  }
  .em-value.entropy  { color: #ff8c42; }
  .em-value.chaos-t { color: #e06c75; }
  .em-value.cortex  { color: #61afef; }
  .em-value.cpu-t   { color: #e5c07b; }
  .em-value.gpu-t   { color: #56b6c2; }
  .em-value.jitter  { color: #c678dd; }
  #engine-banner.collapsed #cluster-canvas-wrap,
  #engine-banner.collapsed #engine-metrics { display: none; }
  #banner-toggle {
    background: none; border: 1px solid var(--border); color: var(--dim);
    font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 4px;
    flex-shrink: 0; margin-left: auto; min-width: auto; line-height: 1;
  }
  #banner-toggle:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <span id="conn">verbinde…</span>
  <button id="settings-btn" title="API-Einstellungen">&#9881;</button>
  <div id="settings-panel">
    <label class="api-toggle">
      <input type="checkbox" id="api-enabled">
      +API-Modus (DeepSeek)
    </label>
    <input type="password" id="api-key" placeholder="DeepSeek API-Key (sk-…)" autocomplete="off">
    <div id="ds-status" class="ds-status off">Kein Key gesetzt</div>
    <div class="hint">Key wird nur lokal im Browser gespeichert.<br>
    Bei aktivem Modus läuft DeepSeek parallel zu Ollama<br>
    — Ensemble wählt beste Antwort.</div>
  </div>
</header>
<div id="engine-banner">
  <div id="cluster-canvas-wrap">
    <canvas id="cluster-canvas"></canvas>
    <div id="cluster-overlay">KEINE DATEN</div>
  </div>
  <div id="engine-metrics">
    <div class="em-item"><span class="em-label">Entropy</span><span class="em-value entropy" id="em-entropy">…</span></div>
    <div class="em-item"><span class="em-label">Chaos °C</span><span class="em-value chaos-t" id="em-temperature">…</span></div>
    <div class="em-item"><span class="em-label">Cortex</span><span class="em-value cortex" id="em-cortex">…</span></div>
    <div class="em-item"><span class="em-label">CPU</span><span class="em-value cpu-t" id="em-cpu">…</span></div>
    <div class="em-item"><span class="em-label">GPU</span><span class="em-value gpu-t" id="em-gpu">…</span></div>
    <div class="em-item"><span class="em-label">Jitter</span><span class="em-value jitter" id="em-jitter">…</span></div>
  </div>
  <button id="banner-toggle" title="Banner ein/aus">▲</button>
</div>
<div id="cluster-popup">
  <div id="cluster-popup-inner">
    <button id="cluster-popup-close" title="Schließen">✕</button>
    <canvas id="cluster-popup-canvas"></canvas>
    <div id="cluster-popup-info"></div>
  </div>
</div>
<div id="log"></div>
<form id="form">
  <select id="profile" title="Retrieval-Profil">
    <option value="">auto</option>
    <option value="precise">präzise</option>
    <option value="balanced">balanced</option>
    <option value="broad">breit</option>
    <option value="resonant">resonant</option>
    <option value="chaos">chaos</option>
  </select>
  <input id="input" placeholder="Frage stellen… (Plan-Keywords starten die Kaskade)"
         autocomplete="off" autofocus>
  <button id="send" type="submit">Senden</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const profile = document.getElementById("profile");
const conn = document.getElementById("conn");
let ws = null, busy = false, progressEl = null, streamEl = null;

function el(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function setBusy(b) { busy = b; send.disabled = b; input.disabled = b; profile.disabled = b; if (!b) input.focus(); }
// Profil aus localStorage wiederherstellen
const saved = localStorage.getItem("collect2-profile");
if (saved) profile.value = saved;
profile.addEventListener("change", () => localStorage.setItem("collect2-profile", profile.value));

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderAnswer(node, text) {
  // 1. Mathe-Segmente VOR Markdown schützen — sonst frisst _Emphasis_ die
  //    Unterstriche in Formeln. 2. Markdown → sanitized HTML. 3. Mathe
  //    (HTML-escaped) zurücksetzen. 4. KaTeX rendert die Text-Segmente.
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
    node.textContent = text;   // CDN offline → Rohtext bleibt lesbar
    renderMath(node);
    return;
  }
  const math = [];
  const shielded = text.replace(
    /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^\n$]+?\$)/g,
    (m) => `@@MATH${math.push(m) - 1}@@`);
  let html = DOMPurify.sanitize(marked.parse(shielded));
  html = html.replace(/@@MATH(\d+)@@/g, (_, i) => escapeHtml(math[i]));
  node.innerHTML = html;
  node.classList.add("rendered");
  renderMath(node);
}

function renderMath(node) {
  // Erst NACH der finalen Antwort rendern (nie auf halbem Streaming-LaTeX).
  // Sicher: der Text steht via textContent im DOM (kein HTML-Injection-Pfad),
  // KaTeX ersetzt dann nur erkannte Mathe-Segmente.
  if (typeof renderMathInElement !== "function") return;
  try {
    renderMathInElement(node, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
      ],
      throwOnError: false,
    });
  } catch (e) { /* Rohtext bleibt lesbar */ }
}

// ── API-Mode Settings ────────────────────────────────────────────────
(function setupApiSettings() {
  const btn = document.getElementById("settings-btn");
  const panel = document.getElementById("settings-panel");
  const cb = document.getElementById("api-enabled");
  const keyInput = document.getElementById("api-key");
  const statusEl = document.getElementById("ds-status");

  // localStorage load
  const saved = localStorage.getItem("collect2_api");
  if (saved) {
    try {
      const cfg = JSON.parse(saved);
      cb.checked = !!cfg.enabled;
      keyInput.value = cfg.key || "";
    } catch (e) {}
  }

  function updateStatus() {
    const hasKey = keyInput.value.trim().length > 0;
    const on = cb.checked && hasKey;
    statusEl.textContent = on ? "DeepSeek aktiv — Ensemble läuft"
      : hasKey ? "Key vorhanden, aber deaktiviert"
      : "Kein Key gesetzt";
    statusEl.className = "ds-status " + (on ? "ok" : "off");
    btn.classList.toggle("active", on);
  }

  function save() {
    const cfg = { enabled: cb.checked, key: keyInput.value.trim() };
    localStorage.setItem("collect2_api", JSON.stringify(cfg));
    updateStatus();
    // Backend informieren (best-effort, fire-and-forget) — Token mitsenden,
    // sonst 401 im Exposure-Modus (COLLECT_API_TOKEN gesetzt).
    const tok = apiToken();
    fetch("/api/mode", {
      method: "POST",
      headers: Object.assign(
        { "Content-Type": "application/json" },
        tok ? { "Authorization": "Bearer " + tok } : {}),
      body: JSON.stringify({ enabled: cfg.enabled, deepseek_key: cfg.key }),
    }).catch(() => {});
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    panel.classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (!panel.contains(e.target) && e.target !== btn) panel.classList.remove("open");
  });
  cb.addEventListener("change", save);
  keyInput.addEventListener("change", save);
  keyInput.addEventListener("blur", save);

  updateStatus();
})();

// Token-Handling: einmalig via ?token=… geseedet → localStorage, danach aus
// der URL entfernt. Ohne Token (localhost-Default) funktioniert alles wie
// bisher. Kein Token im HTML hartkodiert.
(function seedToken() {
  const p = new URLSearchParams(location.search);
  if (p.get("token")) {
    localStorage.setItem("collect2_token", p.get("token"));
    history.replaceState(null, "", location.pathname);
  }
})();
function apiToken() { return localStorage.getItem("collect2_token") || ""; }

function connect() {
  const tok = apiToken();
  const q = tok ? `?token=${encodeURIComponent(tok)}` : "";
  ws = new WebSocket(`ws://${location.host}/ws/chat${q}`);
  ws.onopen = () => { conn.textContent = "🟢 verbunden"; setBusy(false); };
  ws.onclose = (ev) => {
    conn.textContent = ev.code === 1008
      ? "🔒 abgelehnt — Token nötig? (?token=… anhängen)"
      : "🔴 getrennt — neuer Versuch in 3s";
    setBusy(true);
    if (ev.code !== 1008) setTimeout(connect, 3000);
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "progress") {
      if (!progressEl) progressEl = el("progress", "");
      progressEl.textContent = `⏳ ${m.data.stage}${m.data.detail ? ": " + m.data.detail : ""}`;
    } else if (m.type === "token") {
      // Live-Streaming: Antwort baut sich auf, Zähler läuft mit
      if (!streamEl) streamEl = el("msg bot", "");
      streamEl.textContent += m.data.delta || "";
      if (!progressEl) progressEl = el("progress", "");
      progressEl.textContent = `⚡ ${m.data.tokens ?? "…"} tok`;
      log.scrollTop = log.scrollHeight;
    } else if (m.type === "answer") {
      if (progressEl) { progressEl.remove(); progressEl = null; }
      // Streaming-Bubble weiterverwenden: finaler Text ersetzt den rohen
      // Stream (enthält zusätzlich Zonen-Hinweis + Quellen-Fußzeile)
      const d = streamEl || el("msg bot", "");
      streamEl = null;
      renderAnswer(d, m.data.text || "(leer)");
      const meta = m.data.meta || {};
      const manswers = meta.llm_answers || [];
      if (manswers.length > 1) buildModelAccordion(d, manswers);
      buildSourceList(d, meta.sources || []);
      if (meta.zone) {
        const info = document.createElement("div");
        info.className = "meta";
        const winner = manswers.find(a => a.winner);
        const modelInfo = winner ? ` | Modell: ${winner.label}` : "";
        info.textContent = `zone=${meta.zone} · distance=${(meta.best_distance ?? 0).toFixed(1)}` +
          ` · ${meta.duration_s ?? "?"}s` +
          (meta.tokens ? ` · ⚡ ${meta.tokens} tok @ ${meta.tok_per_s ?? "?"} tok/s` : "") +
          (meta.facts_used ? ` · 🔖 ${meta.facts_used} Fakt(en)` : "") +
          (meta.file_chunks ? ` · 📄 ${(meta.file_paths || []).length} Datei(en)/${meta.file_chunks} Chunk(s)` : "") +
          (meta.rewritten_query ? ` · ↻ „${meta.rewritten_query}"` : "") +
          modelInfo;
        d.appendChild(info);
      }
      log.scrollTop = log.scrollHeight;
      setBusy(false);
    } else if (m.type === "error") {
      if (progressEl) { progressEl.remove(); progressEl = null; }
      streamEl = null;
      el("msg bot", "⚠️ " + m.detail);
      setBusy(false);
    }
  };
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  const p = profile.value;
  el("msg user", q);
  input.value = "";
  setBusy(true);
  ws.send(JSON.stringify({ query: p ? `[${p}] ${q}` : q, timeout: 600 }));
});

// ── Modell-Accordion (Ensemble: Winner offen, andere zugeklappt) ──────────

function buildModelAccordion(botEl, answers) {
  const others = answers.filter(a => !a.winner);
  if (!others.length) return;
  const wrapper = document.createElement("div");
  wrapper.className = "ma-list";
  others.forEach(a => {
    const entry = document.createElement("div");
    entry.className = "ma-entry";
    const header = document.createElement("div");
    header.className = "ma-header";
    // Modell-Name
    const name = document.createElement("span");
    name.className = "ma-name";
    name.textContent = a.label + (a.model_detail ? ` (${a.model_detail})` : "");
    header.appendChild(name);
    // Score
    if (a.score !== null && a.score !== undefined) {
      const score = document.createElement("span");
      score.className = "ma-score";
      score.textContent = `Score ${a.score.toFixed(2)}`;
      header.appendChild(score);
    }
    // Badge
    const badge = document.createElement("span");
    if (a.skipped) {
      badge.className = "ma-badge skipped";
      badge.textContent = "ausgelassen";
    } else {
      badge.className = "ma-badge";
      badge.textContent = "Alternativ";
    }
    header.appendChild(badge);
    // Toggle-Indikator
    const toggle = document.createElement("span");
    toggle.className = "ma-toggle";
    toggle.textContent = "▶ Ausklappen";
    header.appendChild(toggle);
    // Click-Handler
    header.addEventListener("click", () => {
      entry.classList.toggle("open");
    });
    // Body
    const body = document.createElement("div");
    body.className = "ma-body";
    if (a.skipped) {
      body.textContent = "Keine Antwort (API-Modus nicht aktiv oder kein Key gesetzt).";
    } else if (a.error) {
      body.textContent = "⚠️ Fehler: " + a.error;
      body.style.color = "#e06c75";
    } else if (a.empty) {
      body.textContent = "(Leere Antwort)";
    } else {
      body.innerHTML = a.content
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
        .replace(/\n/g, "<br>");
    }
    entry.appendChild(header);
    entry.appendChild(body);
    wrapper.appendChild(entry);
  });
  botEl.appendChild(wrapper);
}

// ── Quellen-Liste unter der Antwort ──────────────────────────────────────────

function buildSourceList(botEl, sources) {
  if (!sources.length) return;
  const wrapper = document.createElement("div");
  wrapper.className = "src-list";
  wrapper.innerHTML = "<em>Quellen:</em> ";

  const seen = new Set();
  sources.forEach((src, i) => {
    if (seen.has(src.doc_id)) return;
    seen.add(src.doc_id);
    const tag = {general:"📚", code:"💻", web:"🌐"}[src.kind] || "📄";
    const ref = document.createElement("span");
    ref.className = "src-ref";
    ref.textContent = `[${tag} ${src.title || src.doc_id || "Q"+(i+1)}] `.slice(0, 80);
    ref.title = src.doc_id || "";
    ref.addEventListener("click", () => toggleSourceCard(ref, src));
    wrapper.appendChild(ref);
  });
  botEl.appendChild(wrapper);
}

function toggleSourceCard(refEl, src) {
  const existing = refEl.parentNode.querySelector(".src-card[data-docid='" + src.doc_id + "']");
  if (existing) {
    existing.remove();
    return;
  }
  const card = document.createElement("div");
  card.className = "src-card open";
  card.dataset.docid = src.doc_id;
  card.innerHTML = "<em>lädt…</em>";
  refEl.after(card);

  const show = (title, source, content) => {
    card.innerHTML = "";
    if (title) {
      const s = document.createElement("strong");
      s.textContent = title;
      card.appendChild(s);
    }
    if (source) {
      const e = document.createElement("em");
      e.textContent = " (" + source + ")";
      e.style.color = "var(--dim)";
      card.appendChild(e);
    }
    if (content) {
      card.appendChild(document.createElement("br"));
      card.appendChild(document.createElement("br"));
      card.appendChild(document.createTextNode(content.substring(0, 2500)));
    }
  };

  const tok = apiToken();
  const hdr = tok ? { "Authorization": "Bearer " + tok } : {};
  fetch(`/api/vault/doc/${encodeURIComponent(src.doc_id)}`, { headers: hdr })
    .then(r => r.json())
    .then(doc => {
      const title = doc.title || src.title || "";
      const source = doc.source || src.source || "";
      const content = doc.content || "";
      if (!title && !content) throw new Error("empty");
      show(title, source, content);
    })
    .catch(() => {
      show(src.title || src.doc_id || "", src.source || "", "");
    });
}

connect();
// ── Engine-Banner: Cluster-Map (Canvas) + Live-Metriken ─────────────
(function initBanner() {
  const cv = document.getElementById("cluster-canvas");
  const ctx = cv.getContext("2d");
  const wrap = document.getElementById("cluster-canvas-wrap");
  const overlay = document.getElementById("cluster-overlay");
  const banner = document.getElementById("engine-banner");
  const toggleBtn = document.getElementById("banner-toggle");

  let collapsed = localStorage.getItem("collect2-banner-collapsed") === "1";
  if (collapsed) banner.classList.add("collapsed");
  toggleBtn.addEventListener("click", () => {
    collapsed = !collapsed;
    banner.classList.toggle("collapsed", collapsed);
    localStorage.setItem("collect2-banner-collapsed", collapsed ? "1" : "0");
    if (collapsed) {
      bannerFr.running = false;
      if (animId) { cancelAnimationFrame(animId); animId = 0; }
    } else {
      bannerFr = { val: 0, running: true };
      if (lastCluster) drawClusters(lastCluster);
    }
  });

  const COLS = ["#00e5ff","#00ff88","#ffaa00","#ff3355","#aa88ff",
                "#ff88aa","#88ffaa","#ffff00","#00aaff","#ff6600"];
  let lastCluster = null, animId = 0;

  const popup = document.getElementById("cluster-popup");
  const popupCanvas = document.getElementById("cluster-popup-canvas");
  const popupCtx = popupCanvas.getContext("2d");
  const popupInfo = document.getElementById("cluster-popup-info");
  const popupCloseBtn = document.getElementById("cluster-popup-close");
  let popupOpen = false, popupAnimId = 0;

  wrap.addEventListener("click", () => {
    popupOpen = true;
    popup.style.display = "flex";
    popup.classList.add("open");
    if (lastCluster) drawPopup(lastCluster);
  });
  popupCloseBtn.addEventListener("click", () => {
    popupOpen = false;
    popup.classList.remove("open");
    popup.style.display = "none";
    if (popupAnimId) { cancelAnimationFrame(popupAnimId); popupAnimId = 0; }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && popupOpen) popupCloseBtn.click(); });

  function renderGraph(g, cvEl, context, W, H, frRef) {
    const pad = Math.max(H * .06, 12);
    if (!g || !g.nodes.length) {
      context.fillStyle = "#1a1a2e"; context.font = Math.max(H * .06, 10) + "px monospace";
      context.fillText("KEINE DATEN", W/2-50, H/2+4);
      return;
    }
    const nodes = g.nodes, edges = g.edges, grav = g.gravity_centers || [];
    let xn = Infinity, xx = -Infinity, yn = Infinity, yx = -Infinity;
    nodes.forEach(n => { xn = Math.min(xn, n.x); xx = Math.max(xx, n.x);
                         yn = Math.min(yn, n.y); yx = Math.max(yn, n.y); });
    const xs = (xx - xn) < .01 ? 1 : (W - 2 * pad) / (xx - xn);
    const ys = (yx - yn) < .01 ? 1 : (H - 2 * pad) / (yx - yn);
    const px = n => pad + (n.x - xn) * xs, py = n => pad + (n.y - yn) * ys;
    const nl = {}; nodes.forEach(n => nl[n.id] = n);
    const mw = Math.max(...edges.map(e => e.weight), .001);
    const gridStep = Math.max(H * .05, 20);

    function draw() {
      if (!frRef.running) return;
      context.clearRect(0, 0, W, H);
      context.strokeStyle = "#0d0d18"; context.lineWidth = .3;
      for (let x = 0; x < W; x += gridStep) { context.beginPath(); context.moveTo(x, 0); context.lineTo(x, H); context.stroke(); }
      for (let y = 0; y < H; y += gridStep) { context.beginPath(); context.moveTo(0, y); context.lineTo(W, y); context.stroke(); }
      grav.forEach(g => {
        const gx = px(g), gy = py(g);
        const rad = Math.max(H*.02,8) + g.strength * Math.max(H*.02,4);
        const pulse = 1 + .08 * Math.sin(frRef.val * .05);
        const gr = context.createRadialGradient(gx, gy, 0, gx, gy, rad * pulse);
        gr.addColorStop(0, "rgba(0,229,255,.06)"); gr.addColorStop(1, "rgba(0,0,0,0)");
        context.fillStyle = gr; context.beginPath(); context.arc(gx, gy, rad * pulse, 0, Math.PI*2); context.fill();
      });
      edges.forEach(e => {
        const s = nl[e.source], t = nl[e.target]; if (!s || !t) return;
        const c = COLS[(s.cluster >= 0 ? s.cluster : 0) % COLS.length];
        const ri = parseInt(c.slice(1,3),16), gi = parseInt(c.slice(3,5),16), bi = parseInt(c.slice(5,7),16);
        const al = .08 + .35 * (e.weight / mw);
        context.strokeStyle = `rgba(${ri},${gi},${bi},${al})`;
        context.lineWidth = .3 + 1.2 * (e.weight / mw);
        context.beginPath(); context.moveTo(px(s), py(s)); context.lineTo(px(t), py(t)); context.stroke();
      });
      nodes.forEach(n => {
        const c = n.cluster >= 0 ? COLS[n.cluster % COLS.length] : "#2a2a3e";
        const sz = Math.min(1 + n.strength * .4, 8);
        context.fillStyle = c; context.beginPath(); context.arc(px(n), py(n), sz, 0, Math.PI*2); context.fill();
      });
      grav.forEach((g, i) => {
        const gx = px(g), gy = py(g);
        const p = 1 + .1 * Math.sin(frRef.val * .04 + i), s = Math.max(H*.03,5) * p;
        context.strokeStyle = `rgba(0,229,255,${.5*p})`; context.lineWidth = 1;
        context.beginPath(); context.moveTo(gx, gy-s); context.lineTo(gx+s, gy);
        context.lineTo(gx, gy+s); context.lineTo(gx-s, gy); context.closePath(); context.stroke();
        const fs = Math.max(H*.04,7);
        context.fillStyle = "rgba(0,229,255,.4)"; context.font = fs+"px monospace";
        context.fillText("G"+i+"("+g.size+")", gx+fs, gy-fs*.7);
      });
      frRef.val++;
    }
    return draw;
  }

  let bannerFr = { val: 0, running: true };
  function drawClusters(g) {
    if (collapsed) return;
    if (animId) cancelAnimationFrame(animId);
    cv.width = wrap.offsetWidth || 200;
    cv.height = wrap.offsetHeight || 100;
    const W = cv.width, H = cv.height;
    if (!g || !g.nodes.length) {
      overlay.textContent = "KEINE DATEN";
      ctx.fillStyle = "#1a1a2e"; ctx.font = "10px monospace";
      ctx.fillText("KEINE DATEN", W/2-45, H/2+4);
      return;
    }
    overlay.textContent = g.nodes.length + "N · " + g.edges.length + "E · "
      + g.clusters + "C · G" + (g.gravity_centers || []).length;
    const drawFn = renderGraph(g, cv, ctx, W, H, bannerFr);
    if (!drawFn) return;
    function loop() {
      if (!bannerFr.running) return;
      drawFn();
      animId = requestAnimationFrame(loop);
    }
    loop();
  }

  let popupFr = { val: 0, running: false };
  function drawPopup(g) {
    if (popupAnimId) cancelAnimationFrame(popupAnimId);
    popupCanvas.width = popupCanvas.parentElement.offsetWidth || 800;
    popupCanvas.height = popupCanvas.parentElement.offsetHeight || 500;
    const W = popupCanvas.width, H = popupCanvas.height;
    popupInfo.textContent = g.nodes.length + " Knoten · " + g.edges.length
      + " Kanten · " + g.clusters + " Cluster · "
      + (g.gravity_centers || []).length + " Gravitationszentren";
    popupFr = { val: 0, running: true };
    const drawFn = renderGraph(g, popupCanvas, popupCtx, W, H, popupFr);
    if (!drawFn) return;
    function loop() {
      if (!popupFr.running) return;
      drawFn();
      popupAnimId = requestAnimationFrame(loop);
    }
    loop();
  }

  function updateMetrics(d) {
    if (!d) return;
    document.getElementById("em-entropy").textContent = d.entropy?.toFixed(2) ?? "…";
    document.getElementById("em-temperature").textContent = d.temperature?.toFixed(1) ?? "…";
    document.getElementById("em-cortex").textContent = d.cortex_bias?.toFixed(3) ?? "…";
    document.getElementById("em-cpu").textContent = d.cpu_temp > 0 ? d.cpu_temp.toFixed(1) + "°" : "—";
    document.getElementById("em-gpu").textContent = d.gpu_temp > 0 ? d.gpu_temp.toFixed(1) + "°" : "—";
    document.getElementById("em-jitter").textContent = d.rdtsc_jitter?.toFixed(4) ?? "…";
  }

  async function poll() {
    try {
      const tok = apiToken();
      const hdr = tok ? { "Authorization": "Bearer " + tok } : {};
      const [hr, cr] = await Promise.all([
        fetch("/api/hardware", { headers: hdr }),
        fetch("/api/clusters", { headers: hdr }),
      ]);
      const hw = await hr.json();
      updateMetrics(hw);
      const g = await cr.json();
      lastCluster = g;
      if (!collapsed) drawClusters(g);
      if (popupOpen) drawPopup(g);
    } catch (e) { /* offline — kein Problem */ }
  }

  poll();
  setInterval(poll, 3000);
})();
</script>
