<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- KaTeX für LaTeX-Mathe aus den ARXIV-Quellen ($…$ / $$…$$ / \(…\)).
     CDN: ohne Internet degradiert es sauber zu Rohtext. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- Markdown (marked) + Sanitizer (DOMPurify) — innerHTML nur nach Sanitize -->
<script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e27; --border: #2b2f3d;
    --text: #e4e6ee; --dim: #8b90a3; --accent: #6aa2ff; --user: #24304a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #conn { font-size: 12px; color: var(--dim); margin-left: auto; }
  #log { flex: 1; overflow-y: auto; padding: 18px; }
  .msg {
    max-width: 780px; margin: 0 auto 14px; padding: 10px 14px;
    border-radius: 10px; white-space: pre-wrap; word-wrap: break-word;
  }
  .user { background: var(--user); border: 1px solid #33415e; }
  .bot  { background: var(--panel); border: 1px solid var(--border); }
  .bot.rendered { white-space: normal; }  /* Markdown bringt eigene Absätze */
  .bot pre {
    background: #10131b; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-size: 13px;
  }
  .bot code { background: #10131b; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bot pre code { background: none; padding: 0; }
  .bot h1, .bot h2, .bot h3 { font-size: 1.05em; margin: 12px 0 4px; }
  .bot ul, .bot ol { margin: 6px 0; padding-left: 22px; }
  .bot p { margin: 6px 0; }
  .bot blockquote {
    margin: 6px 0; padding-left: 10px;
    border-left: 3px solid var(--border); color: var(--dim);
  }
  .bot table { border-collapse: collapse; margin: 8px 0; }
  .bot th, .bot td { border: 1px solid var(--border); padding: 4px 8px; }
  .meta { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .progress {
    max-width: 780px; margin: 0 auto 14px; font-size: 13px;
    color: var(--dim); font-family: monospace;
  }
  form {
    display: flex; gap: 10px; padding: 14px 18px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  input {
    flex: 1; max-width: 720px; margin-left: auto; padding: 10px 14px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-right: auto; padding: 10px 20px; border: none; border-radius: 8px;
    background: var(--accent); color: #0c1322; font: inherit; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>{{TITLE}}</h1>
  <span id="conn">verbinde…</span>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" placeholder="Frage stellen… (Plan-Keywords starten die Kaskade)"
         autocomplete="off" autofocus>
  <button id="send" type="submit">Senden</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const conn = document.getElementById("conn");
let ws = null, busy = false, progressEl = null, streamEl = null;

function el(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function setBusy(b) { busy = b; send.disabled = b; input.disabled = b; if (!b) input.focus(); }

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderAnswer(node, text) {
  // 1. Mathe-Segmente VOR Markdown schützen — sonst frisst _Emphasis_ die
  //    Unterstriche in Formeln. 2. Markdown → sanitized HTML. 3. Mathe
  //    (HTML-escaped) zurücksetzen. 4. KaTeX rendert die Text-Segmente.
  if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
    node.textContent = text;   // CDN offline → Rohtext bleibt lesbar
    renderMath(node);
    return;
  }
  const math = [];
  const shielded = text.replace(
    /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^\n$]+?\$)/g,
    (m) => `@@MATH${math.push(m) - 1}@@`);
  let html = DOMPurify.sanitize(marked.parse(shielded));
  html = html.replace(/@@MATH(\d+)@@/g, (_, i) => escapeHtml(math[i]));
  node.innerHTML = html;
  node.classList.add("rendered");
  renderMath(node);
}

function renderMath(node) {
  // Erst NACH der finalen Antwort rendern (nie auf halbem Streaming-LaTeX).
  // Sicher: der Text steht via textContent im DOM (kein HTML-Injection-Pfad),
  // KaTeX ersetzt dann nur erkannte Mathe-Segmente.
  if (typeof renderMathInElement !== "function") return;
  try {
    renderMathInElement(node, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
      ],
      throwOnError: false,
    });
  } catch (e) { /* Rohtext bleibt lesbar */ }
}

// Token-Handling: einmalig via ?token=… geseedet → localStorage, danach aus
// der URL entfernt. Ohne Token (localhost-Default) funktioniert alles wie
// bisher. Kein Token im HTML hartkodiert.
(function seedToken() {
  const p = new URLSearchParams(location.search);
  if (p.get("token")) {
    localStorage.setItem("collect2_token", p.get("token"));
    history.replaceState(null, "", location.pathname);
  }
})();
function apiToken() { return localStorage.getItem("collect2_token") || ""; }

function connect() {
  const tok = apiToken();
  const q = tok ? `?token=${encodeURIComponent(tok)}` : "";
  ws = new WebSocket(`ws://${location.host}/ws/chat${q}`);
  ws.onopen = () => { conn.textContent = "🟢 verbunden"; setBusy(false); };
  ws.onclose = (ev) => {
    conn.textContent = ev.code === 1008
      ? "🔒 abgelehnt — Token nötig? (?token=… anhängen)"
      : "🔴 getrennt — neuer Versuch in 3s";
    setBusy(true);
    if (ev.code !== 1008) setTimeout(connect, 3000);
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "progress") {
      if (!progressEl) progressEl = el("progress", "");
      progressEl.textContent = `⏳ ${m.data.stage}${m.data.detail ? ": " + m.data.detail : ""}`;
    } else if (m.type === "token") {
      // Live-Streaming: Antwort baut sich auf, Zähler läuft mit
      if (!streamEl) streamEl = el("msg bot", "");
      streamEl.textContent += m.data.delta || "";
      if (!progressEl) progressEl = el("progress", "");
      progressEl.textContent = `⚡ ${m.data.tokens ?? "…"} tok`;
      log.scrollTop = log.scrollHeight;
    } else if (m.type === "answer") {
      if (progressEl) { progressEl.remove(); progressEl = null; }
      // Streaming-Bubble weiterverwenden: finaler Text ersetzt den rohen
      // Stream (enthält zusätzlich Zonen-Hinweis + Quellen-Fußzeile)
      const d = streamEl || el("msg bot", "");
      streamEl = null;
      renderAnswer(d, m.data.text || "(leer)");
      const meta = m.data.meta || {};
      if (meta.zone) {
        const info = document.createElement("div");
        info.className = "meta";
        info.textContent = `zone=${meta.zone} · distance=${(meta.best_distance ?? 0).toFixed(1)}` +
          ` · ${meta.duration_s ?? "?"}s` +
          (meta.tokens ? ` · ⚡ ${meta.tokens} tok @ ${meta.tok_per_s ?? "?"} tok/s` : "") +
          (meta.facts_used ? ` · 🔖 ${meta.facts_used} Fakt(en)` : "") +
          (meta.rewritten_query ? ` · ↻ „${meta.rewritten_query}"` : "");
        d.appendChild(info);
      }
      log.scrollTop = log.scrollHeight;
      setBusy(false);
    } else if (m.type === "error") {
      if (progressEl) { progressEl.remove(); progressEl = null; }
      streamEl = null;
      el("msg bot", "⚠️ " + m.detail);
      setBusy(false);
    }
  };
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  el("msg user", q);
  input.value = "";
  setBusy(true);
  ws.send(JSON.stringify({ query: q }));
});

connect();
</script>
</body>
</html>
