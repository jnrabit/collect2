[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collect"
version = "0.1.0"
description = "Multi-Agent-Wissenssystem (Neuaufbau) — Redis-Backbone, Dual-Vault-Retrieval, lokal-first LLM"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Schwere Abhängigkeiten erst ab Phase 2 (Retrieval-Kern)
retrieval = [
    "sentence-transformers>=2.7",
]

[project.scripts]
collect-doctor = "collect.doctor:main"
collect-guard = "collect.regression_guard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collect = ["retrieval/lib/*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
