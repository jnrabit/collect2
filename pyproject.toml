[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collect"
version = "0.1.0"
description = "Multi-Agent-Wissenssystem (Neuaufbau) — Redis-Backbone, Dual-Vault-Retrieval, lokal-first LLM"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-4.0"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # fastapi TestClient
]
# Schwere Abhängigkeiten erst ab Phase 2 (Retrieval-Kern)
retrieval = [
    "sentence-transformers>=2.7",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12",  # WS-Protokoll für uvicorn (/ws/chat)
]

[project.scripts]
collect-doctor = "collect.doctor:main"
collect-guard = "collect.regression_guard:main"
collect-agents = "collect.agents.runner:main"
collect-ask = "collect.client:main"
collect-repl = "collect.repl:main"
collect-api = "collect.api:main"
collect-harvest = "collect.harvest.cli:main"
collect-eval = "collect.eval:main"
collect-vault = "collect.vault_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collect = ["retrieval/lib/*.so", "web/*.html", "workflow/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
